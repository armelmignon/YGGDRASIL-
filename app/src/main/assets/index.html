
<script>
const defaults=[
 ['🧠','Notes','Connaissances, idées, textes'],
 ['💰','Argent','Dépenses, revenus, historique'],
 ['📅','Organisation','Rappels, tâches, calendrier'],
 ['🎬','Médias','Anime, séries, favoris'],
 ['🛠️','Outils','Utilitaires personnels'],
 ['🎙️','Assistant','Vocal + tactile']
];

function loadJSON(key,fallback){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return value===null?fallback:value;
  }catch(e){
    return fallback;
  }
}

let modules=loadJSON('ygg_modules',defaults);
let memories=loadJSON('ygg_memories',[]);
let voiceMode=localStorage.getItem('ygg_voice_mode')||'vocal + tactile';
let theme=localStorage.getItem('ygg_theme')||'dark';

const $=id=>document.getElementById(id);

function saveMemories(){
  localStorage.setItem('ygg_memories',JSON.stringify(memories));
}

function normalize(text){
  return String(text||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[’']/g,' ')
    .replace(/[.,!?;:]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function applyTheme(){
  document.body.classList.toggle('light',theme==='light');
}

function render(filter=''){
  $('grid').innerHTML='';
  const v=filter.trim().toLowerCase();

  const list=modules.filter(m=>
    !v || m[1].toLowerCase().includes(v) ||
    m[2].toLowerCase().includes(v)
  );

  if(!list.length){
    $('grid').innerHTML='<div class="empty">Aucun module trouvé.</div>';
    return;
  }

  list.forEach(m=>{
    const i=modules.indexOf(m);
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML=
      `<div class="icon">${escapeHtml(m[0])}</div>
       <div class="title">${escapeHtml(m[1])}</div>
       <div class="desc">${escapeHtml(m[2])}</div>`;
    b.onclick=()=>openModule(i);
    $('grid').appendChild(b);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#039;'
  }[c]));
}

function openModule(i){
  if(!modules[i])return;

  if(modules[i][1]==='Assistant'){
    openAssistant();
    return;
  }

  openPanel(
    modules[i][0],
    modules[i][1],
    modules[i][2],
    `<div class="row">
      <b>${escapeHtml(modules[i][1])}</b><br>
      <span class="small">${escapeHtml(modules[i][2])}</span>
    </div>`
  );
}

function openPanel(icon,title,desc,html){
  $('ptitle').textContent=icon+'  '+title;
  $('pdesc').textContent=desc;
  $('content').innerHTML=html;
  $('panel').classList.add('show');
}

function closePanel(){
  stopListening();
  $('panel').classList.remove('show');
}

function goHome(){
  closePanel();
  window.scrollTo(0,0);
}

function focusSearch(){
  closePanel();
  $('q').focus();
  window.scrollTo(0,0);
}

function search(e){
  e.preventDefault();
  render($('q').value);
}

$('q').addEventListener('input',()=>render($('q').value));

function settings(){
  stopListening();

  const memoryHTML=memories.length
    ? memories.map((m,i)=>
      `<div class="row">
        <span>${escapeHtml(m.text)}</span>
        <div class="small">${escapeHtml(m.date)}</div>
      </div>`
    ).join('')
    : '<div class="small">Aucune information mémorisée.</div>';

  const html=`
  <div class="row">🧩 <b>Modules</b><br>
    <span class="small">Ajouter des modules personnels.</span><br>
    <button class="action" onclick="addModule()">＋ Ajouter</button>
  </div>

  <div class="row">🎙️ <b>Assistant vocal</b><br>
    <span class="small">Mode actuel : ${escapeHtml(voiceMode)}</span><br>
    <button class="action" onclick="setVoiceMode('vocal uniquement')">Vocal</button>
    <button class="action" onclick="setVoiceMode('tactile uniquement')">Tactile</button>
    <button class="action" onclick="setVoiceMode('vocal + tactile')">Vocal + tactile</button>
    <div class="voice-status" id="voiceStatus">Système vocal : prêt</div>
    <button class="action" onclick="testVoice()">Tester la voix</button>
  </div>

  <div class="row">🎨 <b>Apparence</b><br>
    <span class="small">Thème et affichage.</span><br>
    <button class="action" onclick="setTheme('dark')">Sombre</button>
    <button class="action" onclick="setTheme('light')">Clair</button>
  </div>

  <div class="row">🧠 <b>Mémoire locale</b><br>
    <span class="small">
      ${memories.length} information(s) enregistrée(s) sur ce téléphone.
    </span>
    ${memoryHTML}
  </div>

  <div class="row">🔐 <b>Sécurité</b><br>
    <span class="small">Espace réservé aux fonctions de sécurité.</span>
  </div>

  <div class="row">☁️ <b>Données & Vault</b><br>
    <span class="small">Espace réservé à la sauvegarde et à la synchronisation.</span>
  </div>

  <div class="row">📦 <b>YGGDRASIL</b><br>
    <span class="small">Version 0.6 · cerveau local en préparation.</span>
  </div>`;

  openPanel('⚙️','PARAMÈTRES','Configuration générale de YGGDRASIL',html);
}

function setVoiceMode(mode){
  voiceMode=mode;
  localStorage.setItem('ygg_voice_mode',mode);
  settings();
}

function openAssistant(){
  stopListening();

  const html=`
  <div class="voice-box">
    <div class="small">ASSISTANT YGGDRASIL</div>
    <button id="micButton" class="mic" onclick="toggleListening()">🎙️</button>
    <div id="voiceText" class="voice-text">
      Appuie sur le microphone et parle.
    </div>
    <div id="voiceStatus" class="voice-status">
      Cerveau local : prêt
    </div>
    <button class="action" onclick="testVoice()">🔊 Tester la voix</button>
    <button class="action" onclick="clearVoiceText()">Effacer</button>
  </div>`;

  openPanel('🎙️','ASSISTANT','Assistant vocal + tactile',html);
}

function testVoice(){
  const status=$('voiceStatus');

  if(window.AndroidVoice && AndroidVoice.isAvailable()){
    AndroidVoice.speak('YGGDRASIL est prêt.');
    if(status)status.textContent='Lecture vocale en cours…';
    return;
  }

  if(status)status.textContent='Synthèse vocale Android indisponible.';
}

function speak(text){
  if(window.AndroidVoice && AndroidVoice.isAvailable()){
    AndroidVoice.speak(text);
    return;
  }

  const status=$('voiceStatus');
  if(status)status.textContent='Système vocal indisponible.';
}

let isListening=false;

function toggleListening(){
  if(isListening){
    stopListening();
    return;
  }

  if(!window.AndroidVoice){
    const status=$('voiceStatus');
    if(status)status.textContent='Système vocal Android indisponible.';
    return;
  }

  isListening=true;

  const button=$('micButton');
  const status=$('voiceStatus');
  const text=$('voiceText');

  if(button){
    button.classList.add('listening');
    button.textContent='⏹️';
  }

  if(status)status.textContent='🎙️ YGGDRASIL vous écoute…';
  if(text)text.textContent='Parlez maintenant…';

  AndroidVoice.startListening();
}

function stopListening(){
  if(window.AndroidVoice){
    AndroidVoice.stopListening();
  }

  isListening=false;

  const button=$('micButton');
  if(button){
    button.classList.remove('listening');
    button.textContent='🎙️';
  }
}

window.yggVoiceResult=function(transcript){
  isListening=false;

  const text=$('voiceText');
  const status=$('voiceStatus');
  const button=$('micButton');

  if(text)text.textContent=transcript;
  if(status)status.textContent='Commande reçue.';

  if(button){
    button.classList.remove('listening');
    button.textContent='🎙️';
  }

  handleVoiceCommand(transcript);
};

window.yggVoiceEnded=function(){
  isListening=false;

  const button=$('micButton');

  if(button){
    button.classList.remove('listening');
    button.textContent='🎙️';
  }
};

function clearVoiceText(){
  const text=$('voiceText');
  const status=$('voiceStatus');

  if(text)text.textContent='Appuie sur le microphone et parle.';
  if(status)status.textContent='Cerveau local : prêt';
}

function answer(message){
  const text=$('voiceText');
  const status=$('voiceStatus');

  if(text)text.textContent=message;
  if(status)status.textContent='Réponse du cerveau local.';

  speak(message);
}

function remember(information){
  const value=information.trim();

  if(!value){
    answer('Je n’ai pas entendu quelle information mémoriser.');
    return;
  }

  memories.push({
    text:value,
    date:new Date().toLocaleString('fr-FR')
  });

  saveMemories();
  answer('C’est enregistré dans ma mémoire locale.');
}

function findMemory(question){
  const q=normalize(question);

  if(!memories.length){
    answer('Ma mémoire locale est encore vide.');
    return;
  }

  const words=q.split(' ').filter(w=>w.length>3);
  let matches=memories.filter(m=>{
    const saved=normalize(m.text);
    return words.some(w=>saved.includes(w));
  });

  if(matches.length){
    answer('Voici ce que j’ai mémorisé : '+matches.map(m=>m.text).join('. '));
  }else{
    answer('Je ne trouve pas cette information dans ma mémoire locale.');
  }
}

function openModuleByName(name){
  const wanted=normalize(name);

  const index=modules.findIndex(m=>{
    const moduleName=normalize(m[1]);
    return wanted.includes(moduleName)||moduleName.includes(wanted);
  });

  if(index<0){
    answer('Je ne trouve pas ce module.');
    return;
  }

  openModule(index);
  answer('Ouverture du module '+modules[index][1]+'.');
}

function handleVoiceCommand(command){
  if(!command)return;

  const original=String(command).trim();
  const c=normalize(original);

  if(!c)return;

  // Salutations
  if(/^(bonjour|bonsoir|salut|coucou)( yggdrasil)?$/.test(c)){
    answer('Bonjour. YGGDRASIL est à votre écoute.');
    return;
  }

  // Enregistrer une information dans la mémoire
  const rememberMatch=original.match(
    /^(?:retiens que|souviens toi que|memorise que|n oublie pas que|enregistre que)\s+(.+)$/i
  );

  if(rememberMatch){
    remember(rememberMatch[1]);
    return;
  }

  // Consulter la mémoire
  if(
    c.includes('que sais tu sur')||
    c.includes('qu est ce que tu sais sur')||
    c.includes('qu as tu retenu')||
    c.includes('rappelle moi ce que')||
    c.includes('cherche dans ta memoire')
  ){
    const question=c
      .replace('que sais tu sur','')
      .replace('qu est ce que tu sais sur','')
      .replace('qu as tu retenu','')
      .replace('rappelle moi ce que','')
      .replace('cherche dans ta memoire','');

    findMemory(question);
    return;
  }

  // Heure et date
  if(c.includes('quelle heure')||c.includes('donne moi l heure')){
    answer('Il est '+new Date().toLocaleTimeString('fr-FR',{
      hour:'2-digit',minute:'2-digit'
    }));
    return;
  }

  if(c.includes('quelle date')||c.includes('quel jour')||c.includes('on est quel jour')){
    answer('Nous sommes le '+new Date().toLocaleDateString('fr-FR',{
      weekday:'long',day:'numeric',month:'long',year:'numeric'
    }));
    return;
  }

  // Paramètres
  if(
    c.includes('ouvre les reglages')||
    c.includes('ouvre les parametres')||
    c.includes('va dans les reglages')||
    c.includes('ouvre les preferences')
  ){
    settings();
    answer('Ouverture des paramètres.');
    return;
  }

  // Accueil
  if(
    c==='retour'||
    c==='accueil'||
    c==='reviens a l accueil'||
    c==='retour a l accueil'
  ){
    goHome();
    answer('Retour à l’accueil.');
    return;
  }

  // Ouverture d'un module
  if(c.startsWith('ouvre ')||c.startsWith('ouvre le ')||c.startsWith('ouvre la ')){
    let name=c
      .replace(/^ouvre le /,'')
      .replace(/^ouvre la /,'')
      .replace(/^ouvre /,'');

    openModuleByName(name);
    return;
  }

  // Présentation
  if(
    c.includes('qui es tu')||
    c.includes('que peux tu faire')||
    c.includes('presente toi')
  ){
    answer('Je suis YGGDRASIL. Je peux ouvrir tes modules, mémoriser des informations et exécuter certaines commandes sans connexion Internet.');
    return;
  }

  // État de la mémoire
  if(c.includes('combien')&&c.includes('memoire')){
    answer('Ma mémoire contient '+memories.length+' information(s).');
    return;
  }

  // État du système
  if(c.includes('es tu la')||c.includes('tu es pret')){
    answer('Oui. Mon cerveau local fonctionne et je suis à votre écoute.');
    return;
  }

  // Réponse de secours
  answer('J’ai bien reçu votre demande, mais je ne sais pas encore y répondre hors connexion. Mon cerveau local sera enrichi progressivement.');
}

function setTheme(t){
  theme=t;
  localStorage.setItem('ygg_theme',t);
  applyTheme();
  settings();
}

function addModule(){
  const name=prompt('Nom du nouveau module :');
  if(!name||!name.trim())return;

  modules.push(['◈',name.trim(),'Module personnel']);
  localStorage.setItem('ygg_modules',JSON.stringify(modules));
  render($('q').value);
  settings();
}

applyTheme();

setTimeout(()=>{
  $('splash').style.display='none';
  $('home').style.display='block';
  $('nav').style.display='flex';
  render();
},1800);
  </script>
