
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YGGDRASIL v0.7</title>

<style>
:root{
  --bg:#050505;--panel:#101010;--text:#f5f5f5;--muted:#909090;
  --line:#252525;--accent:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
body.light{--bg:#f4f4f4;--panel:#fff;--text:#111;--muted:#666;--line:#d7d7d7;--accent:#111}
button,input{font:inherit}
button{cursor:pointer}
.screen{min-height:100vh;background:var(--bg)}
.splash{display:flex;align-items:center;justify-content:center;flex-direction:column}
.logo{font-family:Georgia,serif;letter-spacing:.24em;font-size:27px;color:var(--text)}
.fade{animation:fade 1.7s ease both}
@keyframes fade{0%{opacity:0}25%,75%{opacity:1}100%{opacity:0}}
.home{display:none;max-width:520px;margin:auto;padding:18px 16px 95px}
header{padding:14px 4px 18px}
.brand{font-family:Georgia,serif;letter-spacing:.2em;font-size:24px}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.search{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:16px;margin:4px 0 25px;padding:0 14px}
.search span{color:var(--muted);font-size:21px}
.search input{width:100%;padding:15px 9px;background:none;border:0;outline:0;color:var(--text)}
h2{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px 15px;min-height:110px;color:var(--text);text-align:left}
.icon{font-size:25px;margin-bottom:10px}
.title{font-weight:650}
.desc{font-size:11px;color:var(--muted);margin-top:5px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:9px 4px 11px;z-index:5}
.nav button{border:0;background:none;color:var(--muted);font-size:10px}
.nav button:first-child{color:var(--text)}
.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:2px}
.panel{display:none;position:fixed;inset:0;background:var(--bg);z-index:10;padding:20px 18px;overflow:auto}
.panel.show{display:block}
.back{background:none;border:0;color:var(--text);font-size:27px}
.panel h1{font-family:Georgia,serif;letter-spacing:.1em}
.row{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px;margin:9px 0;overflow:hidden}
.row button{float:right;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:5px 10px}
.small{color:var(--muted);font-size:12px}
.action{display:inline-block;float:none;margin:10px 8px 0 0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--accent);color:var(--bg)}
.voice-status{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.voice-box{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.voice-text{font-size:14px;min-height:24px;line-height:1.6}
.mic{display:block;width:72px;height:72px;margin:14px auto 8px;border-radius:50%;border:1px solid var(--line);background:var(--accent);color:var(--bg);font-size:30px}
.mic.listening{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.empty{grid-column:1/-1;color:var(--muted);font-size:13px;padding:20px 5px}
</style>
</head>

<body>

<section id="splash" class="screen splash">
  <div class="logo fade">YGGDRASIL</div>
</section>

<main id="home" class="home">
<header>
  <div class="brand">YGGDRASIL</div>
  <div class="sub">Votre espace personnel</div>
</header>

<form class="search" onsubmit="search(event)">
  <span>⌕</span>
  <input id="q" placeholder="Recherche" autocomplete="off">
</form>

<h2>MODULES</h2>
<div id="grid" class="grid"></div>
</main>

<nav id="nav" class="nav" style="display:none">
  <button onclick="goHome()"><i>⌂</i>Accueil</button>
  <button onclick="focusSearch()"><i>⌕</i>Recherche</button>
  <button onclick="settings()"><i>⚙</i>Réglages</button>
</nav>

<section id="panel" class="panel">
  <button class="back" onclick="closePanel()">‹</button>
  <h1 id="ptitle"></h1>
  <p id="pdesc" class="small"></p>
  <div id="content"></div>
</section>

<script>
// =====================================
// 1. DONNÉES ET MÉMOIRE
// =====================================

const defaults=[
 ['🧠','Notes','Connaissances, idées, textes'],
 ['💰','Argent','Dépenses, revenus, historique'],
 ['📅','Organisation','Rappels, tâches, calendrier'],
 ['🎬','Médias','Anime, séries, favoris'],
 ['🛠️','Outils','Utilitaires personnels'],
 ['🎙️','Assistant','Vocal + tactile']
];

function loadJSON(key,fallback){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return value===null?fallback:value;
  }catch(e){
    return fallback;
  }
}

let modules=loadJSON('ygg_modules',defaults);
let memories=loadJSON('ygg_memories',[]);
let voiceMode=localStorage.getItem('ygg_voice_mode')||'vocal + tactile';
let theme=localStorage.getItem('ygg_theme')||'dark';

const $=id=>document.getElementById(id);

function refreshMemories(){
  const stored=loadJSON('ygg_memories',[]);
  memories=Array.isArray(stored)?stored:[];
}

function saveMemories(){
  localStorage.setItem('ygg_memories',JSON.stringify(memories));
}

function normalize(text){
  return String(text||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[’']/g,' ')
    .replace(/[.,!?;:]/g,' ')
    .replace(/[-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// =====================================
// 2. INTERFACE
// =====================================

function applyTheme(){
  document.body.classList.toggle('light',theme==='light');
}

function render(filter=''){
  $('grid').innerHTML='';
  const v=filter.trim().toLowerCase();

  const list=modules.filter(m=>
    !v || m[1].toLowerCase().includes(v) ||
    m[2].toLowerCase().includes(v)
  );

  if(!list.length){
    $('grid').innerHTML='<div class="empty">Aucun module trouvé.</div>';
    return;
  }

  list.forEach(m=>{
    const i=modules.indexOf(m);
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML=
      `<div class="icon">${escapeHtml(m[0])}</div>
       <div class="title">${escapeHtml(m[1])}</div>
       <div class="desc">${escapeHtml(m[2])}</div>`;
    b.onclick=()=>openModule(i);
    $('grid').appendChild(b);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#039;'
  }[c]));
}

function openModule(i){
  if(!modules[i])return;

  if(modules[i][1]==='Assistant'){
    openAssistant();
    return;
  }

  openPanel(
    modules[i][0],
    modules[i][1],
    modules[i][2],
    `<div class="row">
      <b>${escapeHtml(modules[i][1])}</b><br>
      <span class="small">${escapeHtml(modules[i][2])}</span>
    </div>`
  );
}

function openPanel(icon,title,desc,html){
  $('ptitle').textContent=icon+'  '+title;
  $('pdesc').textContent=desc;
  $('content').innerHTML=html;
  $('panel').classList.add('show');
}

function closePanel(){
  stopListening();
  $('panel').classList.remove('show');
}

function goHome(){
  closePanel();
  window.scrollTo(0,0);
}

function focusSearch(){
  closePanel();
  $('q').focus();
  window.scrollTo(0,0);
}

function search(e){
  e.preventDefault();
  render($('q').value);
}

$('q').addEventListener('input',()=>render($('q').value));

// =====================================
// 3. PARAMÈTRES
// =====================================

function settings(){
  stopListening();
  refreshMemories();

  const memoryHTML=memories.length
    ? memories.map(m=>
      `<div class="row">
        <span>${escapeHtml(m.text)}</span>
        <div class="small">${escapeHtml(m.date||'')}</div>
      </div>`
    ).join('')
    : '<div class="small">Aucune information mémorisée.</div>';

  const html=`
  <div class="row">🧩 <b>Modules</b><br>
    <span class="small">Ajouter des modules personnels.</span>
    <br><button class="action" onclick="addModule()">＋ Ajouter</button>
  </div>

  <div class="row">🎙️ <b>Assistant vocal</b><br>
    <span class="small">Mode actuel : ${escapeHtml(voiceMode)}</span><br>
    <button class="action" onclick="setVoiceMode('vocal uniquement')">Vocal</button>
    <button class="action" onclick="setVoiceMode('tactile uniquement')">Tactile</button>
    <button class="action" onclick="setVoiceMode('vocal + tactile')">Vocal + tactile</button>
    <div class="voice-status" id="voiceStatus">Système vocal : prêt</div>
    <button class="action" onclick="testVoice()">Tester la voix</button>
  </div>

  <div class="row">🎨 <b>Apparence</b><br>
    <span class="small">Thème et affichage.</span><br>
    <button class="action" onclick="setTheme('dark')">Sombre</button>
    <button class="action" onclick="setTheme('light')">Clair</button>
  </div>

  <div class="row">🧠 <b>Mémoire locale</b><br>
    <span class="small">${memories.length} information(s) enregistrée(s) sur ce téléphone.</span>
    ${memoryHTML}
    <button class="action" onclick="clearMemories()">Vider la mémoire</button>
  </div>

  <div class="row">🔐 <b>Sécurité</b><br>
    <span class="small">Espace réservé aux fonctions de sécurité de YGGDRASIL.</span>
  </div>

  <div class="row">☁️ <b>Données & Vault</b><br>
    <span class="small">Espace réservé à la sauvegarde et à la synchronisation.</span>
  </div>

  <div class="row">📦 <b>YGGDRASIL</b><br>
    <span class="small">Version 0.7 · cerveau local enrichi.</span>
  </div>`;

  openPanel('⚙️','PARAMÈTRES','Configuration générale de YGGDRASIL',html);
}

function setVoiceMode(mode){
  voiceMode=mode;
  localStorage.setItem('ygg_voice_mode',mode);
  settings();
}

function setTheme(t){
  theme=t;
  localStorage.setItem('ygg_theme',t);
  applyTheme();
  settings();
}

function addModule(){
  const name=prompt('Nom du nouveau module :');
  if(!name||!name.trim())return;

  modules.push(['◈',name.trim(),'Module personnel']);
  localStorage.setItem('ygg_modules',JSON.stringify(modules));
  render($('q').value);
  settings();
}

// =====================================
// 4. ASSISTANT VOCAL
// =====================================

function openAssistant(){
  stopListening();

  const html=`
  <div class="voice-box">
    <div class="small">ASSISTANT YGGDRASIL · CERVEAU LOCAL</div>
    <button id="micButton" class="mic" onclick="toggleListening()">🎙️</button>
    <div id="voiceText" class="voice-text">Appuie sur le microphone et parle.</div>
    <div id="voiceStatus" class="voice-status">Cerveau local : prêt</div>
    <button class="action" onclick="testVoice()">🔊 Tester la voix</button>
    <button class="action" onclick="clearVoiceText()">Effacer</button>
  </div>`;

  openPanel('🎙️','ASSISTANT','Assistant vocal + tactile',html);
}

function testVoice(){
  const status=$('voiceStatus');

  if(window.AndroidVoice && AndroidVoice.isAvailable()){
    AndroidVoice.speak('YGGDRASIL est prêt.');
    if(status)status.textContent='Lecture vocale en cours…';
    return;
  }

  if(status)status.textContent='Synthèse vocale Android indisponible.';
}

function speak(text){
  if(window.AndroidVoice && AndroidVoice.isAvailable()){
    AndroidVoice.speak(text);
    return;
  }

  const status=$('voiceStatus');
  if(status)status.textContent='Système vocal indisponible.';
}

let isListening=false;

function toggleListening(){
  if(isListening){
    stopListening();
    return;
  }

  if(!window.AndroidVoice){
    const status=$('voiceStatus');
    if(status)status.textContent='Système vocal Android indisponible.';
    return;
  }

  isListening=true;

  const button=$('micButton');
  const status=$('voiceStatus');
  const text=$('voiceText');

  if(button){
    button.classList.add('listening');
    button.textContent='⏹️';
  }

  if(status)status.textContent='🎙️ YGGDRASIL vous écoute…';
  if(text)text.textContent='Parlez maintenant…';

  AndroidVoice.startListening();
}

function stopListening(){
  if(window.AndroidVoice){
    AndroidVoice.stopListening();
  }

  isListening=false;

  const button=$('micButton');
  if(button){
    button.classList.remove('listening');
    button.textContent='🎙️';
  }
}

window.yggVoiceResult=function(transcript){
  isListening=false;

  const text=$('voiceText');
  const status=$('voiceStatus');
  const button=$('micButton');

  if(text)text.textContent=transcript;
  if(status)status.textContent='Commande reçue.';

  if(button){
    button.classList.remove('listening');
    button.textContent='🎙️';
  }

  handleVoiceCommand(transcript);
};

window.yggVoiceEnded=function(){
  isListening=false;

  const button=$('micButton');

  if(button){
    button.classList.remove('listening');
    button.textContent='🎙️';
  }
};

function clearVoiceText(){
  const text=$('voiceText');
  const status=$('voiceStatus');

  if(text)text.textContent='Appuie sur le microphone et parle.';
  if(status)status.textContent='Cerveau local : prêt';
}

// =====================================
// 5. RÉPONSES ET MÉMOIRE INTELLIGENTE
// =====================================

function answer(message){
  const text=$('voiceText');
  const status=$('voiceStatus');

  if(text)text.textContent=message;
  if(status)status.textContent='Réponse du cerveau local.';

  speak(message);
}

function remember(information){
  const value=String(information||'').trim();

  if(!value){
    answer('Je n’ai pas entendu quelle information mémoriser.');
    return;
  }

  refreshMemories();

  memories.push({
    text:value,
    date:new Date().toLocaleString('fr-FR')
  });

  saveMemories();
  answer('C’est enregistré dans ma mémoire locale.');
}

// Mots courants ignorés lors de la recherche
const ignoredWords=[
  'que','quoi','qui','est','sais','sait','sur','dans',
  'mon','ma','mes','ton','ta','tes','son','sa','ses',
  'moi','toi','nous','vous','elle','elles','ils',
  'une','des','les','la','le','un','du','de','d',
  'ce','cet','cette','ces','pour','avec','sans',
  'comment','pourquoi','quand','quel','quelle',
  'quels','quelles','est ce','tu','as','ai','avoir',
  'retenu','rappelle','souviens','memoire','information',
  'informations','parle','donne','montre','dis'
];

function getKeywords(text){
  return normalize(text)
    .split(' ')
    .filter(w=>w.length>2 && !ignoredWords.includes(w));
}

function findMemory(question){
  refreshMemories();

  if(!memories.length){
    answer('Ma mémoire locale est encore vide.');
    return;
  }

  const q=normalize(question);
  const keywords=getKeywords(q);

  // Recherche prioritaire par sujet
  const subjects=[
    {words:['projet','application','app'],label:'projet'},
    {words:['nom','appelle','prenom'],label:'nom'},
    {words:['travail','metier','profession'],label:'travail'},
    {words:['objectif','but','reve'],label:'objectif'},
    {words:['preference','prefere','aime'],label:'préférence'}
  ];

  let subjectMatches=[];

  subjects.forEach(subject=>{
    if(subject.words.some(w=>q.includes(w))){
      const found=memories.filter(m=>{
        const saved=normalize(m.text);
        return subject.words.some(w=>saved.includes(w));
      });

      subjectMatches=subjectMatches.concat(found);
    }
  });

  if(subjectMatches.length){
    const unique=[...new Set(subjectMatches)];
    answer(
      'Voici ce que j’ai retenu : '+
      unique.slice(-4).map(m=>m.text).join('. ')
    );
    return;
  }

  // Recherche par mots-clés
  const ranked=memories.map(m=>{
    const saved=normalize(m.text);
    const savedWords=getKeywords(saved);
    let score=0;

    keywords.forEach(w=>{
      if(savedWords.includes(w))score+=3;
      else if(saved.includes(w))score+=1;
    });

    return {memory:m,score};
  }).filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score);

  if(ranked.length){
    const best=ranked.filter(x=>x.score>=ranked[0].score-1);

    answer(
      'J’ai retrouvé ceci dans ma mémoire : '+
      best.slice(0,4).map(x=>x.memory.text).join('. ')
    );
    return;
  }

  // Question générale sur ce qui est mémorisé
  if(
    q.includes('tout')||
    q.includes('sur moi')||
    q.includes('me connais')||
    q.includes('mes souvenirs')
  ){
    answer(
      'Voici les informations que j’ai retenues : '+
      memories.slice(-5).map(m=>m.text).join('. ')
    );
    return;
  }

  answer('Je ne trouve pas encore cette information dans ma mémoire locale. Tu peux me demander de la retenir.');
}

function clearMemories(){
  if(!confirm('Effacer toutes les informations de la mémoire locale ?'))return;
  memories=[];
  saveMemories();
  settings();
}

// =====================================
// 6. COMPRÉHENSION DES COMMANDES
// =====================================

function openModuleByName(name){
  const wanted=normalize(name);

  const index=modules.findIndex(m=>{
    const moduleName=normalize(m[1]);
    return wanted.includes(moduleName)||moduleName.includes(wanted);
  });

  if(index<0){
    answer('Je ne trouve pas ce module.');
    return;
  }

  openModule(index);
  answer('Ouverture du module '+modules[index][1]+'.');
}

function handleVoiceCommand(command){

  }

</body>
