name: Construire YGGDRASIL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > yggdrasil-release.jks

      - name: Vérifier et récupérer l'alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "Contenu du keystore :"
          keytool -list \
            -keystore yggdrasil-release.jks \
            -storepass "$KEYSTORE_PASSWORD"

          KEY_ALIAS=$(keytool -list \
            -keystore yggdrasil-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E '^[^,]+,' \
            | head -n 1 \
            | cut -d',' -f1)

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERREUR : impossible de trouver l'alias."
            exit 1
          fi

          echo "Alias trouvé : $KEY_ALIAS"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Compiler l'APK Release
        run: |
          gradle assembleRelease --no-daemon

      - name: Trouver Android Build Tools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Build Tools utilisées : $BUILD_TOOLS"

      - name: Aligner l'APK
        run: |
          "$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

      - name: Signer l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks yggdrasil-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out YGGDRASIL.apk \
            app-release-aligned.apk

      - name: Vérifier la signature
        run: |
          "$BUILD_TOOLS/apksigner" verify --verbose YGGDRASIL.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: YGGDRASIL-release-apk
          path: YGGDRASIL.apk
